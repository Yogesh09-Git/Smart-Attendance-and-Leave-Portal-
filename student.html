<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        h2 {
            color: #444;
            margin-top: 25px;
        }

        .attendance {
            background: #eef6ff;
            padding: 18px;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
        }

        .attendance span {
            font-weight: bold;
        }

        input, textarea, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        button {
            background: #4b5563;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #374151;
        }

        .success {
            display: none;
            background: #d1fae5;
            color: #065f46;
            padding: 12px;
            margin-top: 15px;
            border-radius: 6px;
            text-align: center;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            background: #fff7ed;
            border-radius: 8px;
        }

        .logout {
            background: #dc2626;
            margin-top: 25px;
        }

        .logout:hover {
            background: #b91c1c;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Dashboard</h1>

    <h2>Attendance</h2>

    <div class="attendance">
        Attendance: <span>78%</span>
    </div>

    <h2>Apply Attendance</h2>

    <input type="date" id="attendanceDate">

    <button onclick="applyAttendance()">
        Apply Attendance
    </button>

    <div id="attendanceMessage" class="success">
        Attendance applied successfully!
    </div>


    <h2>Apply Leave</h2>

    <label>From Date</label>
    <input type="date" id="fromDate">

    <label>To Date</label>
    <input type="date" id="toDate">

    <input
        type="text"
        id="reason"
        placeholder="Enter leave reason"
    >

    <button onclick="applyLeave()">
        Apply Leave
    </button>

    <div id="leaveMessage" class="success">
        Leave Applied Successfully!
    </div>


    <div class="status">
        <strong>Leave Status:</strong>
        <span id="leaveStatus">No leave applied</span>
    </div>


    <button class="logout" onclick="logout()">
        Logout
    </button>

</div>


<script>

function applyAttendance() {

    const date = document.getElementById("attendanceDate").value;

    if (date === "") {
        alert("Please select attendance date");
        return;
    }

    document.getElementById("attendanceMessage").style.display = "block";
}


function applyLeave() {

    const fromDate = document.getElementById("fromDate").value;
    const toDate = document.getElementById("toDate").value;
    const reason = document.getElementById("reason").value.trim();

    if (fromDate === "" || toDate === "" || reason === "") {
        alert("Please fill all leave details");
        return;
    }

    document.getElementById("leaveMessage").style.display = "block";

    document.getElementById("leaveStatus").innerText = "Pending";

}


function logout() {

    window.location.href =
    "https://smart-attendance-cloudformation-mansi.s3.ap-south-1.amazonaws.com/SmartAttendancePortal/login.html";

}

</script>

</body>
</html>
